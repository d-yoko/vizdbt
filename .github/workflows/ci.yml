name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          cd ui && bun install

      - name: Typecheck (backend)
        run: bunx tsc --noEmit

      - name: Typecheck (frontend)
        run: cd ui && bunx tsc --noEmit

      - name: Test
        run: bun test
